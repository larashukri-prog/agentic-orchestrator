openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mcp
    description: Model Context Protocol data feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mcp/feed:
    get:
      operationId: getMcpFeed
      tags: [mcp]
      summary: MCP alert feed
      description: Returns Model Context Protocol alert data for VIP management
      responses:
        "200":
          description: MCP alert feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpAlert"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    McpAlert:
      type: object
      required:
        - id
        - clientName
        - tier
        - triggerEvent
        - suggestedAction
        - confidenceScore
        - urgency
        - dataSourcesEvaluated
        - chainOfThought
        - actionPayload
      properties:
        id:
          type: string
        clientName:
          type: string
        tier:
          type: string
          description: Client relationship tier
        triggerEvent:
          type: string
        suggestedAction:
          type: string
        confidenceScore:
          type: integer
          description: Confidence percentage (0-100)
        urgency:
          type: string
          description: "high, medium, or low"
        dataSourcesEvaluated:
          type: array
          items:
            type: string
          description: Data sources evaluated to generate this recommendation
        chainOfThought:
          type: array
          items:
            type: string
          description: AI reasoning steps that led to this recommendation
        actionPayload:
          type: string
          description: Pre-drafted communication to send
