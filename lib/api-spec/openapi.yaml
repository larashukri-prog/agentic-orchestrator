openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mcp
    description: Model Context Protocol data feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mcp/feed:
    get:
      operationId: getMcpFeed
      tags: [mcp]
      summary: MCP alert feed
      description: Returns simulated Model Context Protocol alert data for VIP management
      responses:
        "200":
          description: MCP alert feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpAlert"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    McpAlert:
      type: object
      required:
        - id
        - clientName
        - triggerEvent
        - suggestedAction
        - confidenceScore
        - urgency
        - urgencyTime
        - actionLabel
      properties:
        id:
          type: integer
        clientName:
          type: string
        triggerEvent:
          type: string
        suggestedAction:
          type: string
        confidenceScore:
          type: integer
          description: Confidence percentage (0-100)
        urgency:
          type: string
          description: "CRITICAL, PRIORITY, or SCHEDULED"
        urgencyTime:
          type: string
        actionLabel:
          type: string
