kind = "web"
previewPath = "/"
title = "VIP Dashboard"
version = "1.0.0"
id = "artifacts/vip-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22658

[services.development]
run = "pnpm --filter @workspace/vip-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vip-dashboard", "run", "build" ]
publicDir = "artifacts/vip-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22658"
BASE_PATH = "/"
